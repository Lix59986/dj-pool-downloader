<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ Pool Downloader</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; font-size: 13px; color: #1f2328; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
      .count { font-weight: 600; }
      .muted { color: #666; }
      button { margin-top: 8px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
      button:hover { background: #f6f8fa; }
    </style>
  </head>
  <body>
    <h1>DJ Pool Downloader</h1>
    <div class="row"><span>Треков в базе</span><span class="count" id="count">…</span></div>
    <div class="row"><span>Статус</span><span id="status">загрузка…</span></div>
    <button id="refresh">Обновить</button>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
